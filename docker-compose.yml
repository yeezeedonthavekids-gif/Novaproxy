# docker compose up -d   ->  NOVA on http://localhost:8080
services:
  nova:
    build: .
    image: nova:latest
    container_name: nova
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 8080
      LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Plenty for hundreds of users; keeps NOVA from starving other services.
    mem_limit: 512m
    stop_grace_period: 15s
