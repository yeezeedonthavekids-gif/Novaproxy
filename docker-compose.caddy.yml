# NOVA + Caddy (automatic HTTPS). Used by deploy/oracle-setup.sh on a VPS / Oracle VM.
#   DOMAIN=nova.example.com docker compose -f docker-compose.caddy.yml up -d --build
services:
  nova:
    build: .
    image: nova:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 8080
      LOG_LEVEL: info
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 512m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile.docker:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - nova

volumes:
  caddy_data:
  caddy_config:
